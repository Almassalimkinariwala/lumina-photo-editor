<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>Lumina Photo Editor</title>
<style>
:root{color-scheme:dark;--bg:#14161b;--pan:#1b1e25;--line:#2b303a;--tx:#eef0f4;--mut:#8f97a6;--ac:#ffb43c;--acx:#1a1203}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px}
header h1{font-size:18px;margin:0;flex:1;font-weight:700;letter-spacing:.2px}
button,.btn{font:inherit;color:var(--tx);background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button.pri,.btn.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;display:none}
#empty{text-align:center;padding:24px;color:var(--mut)}
#empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
#empty .btn{display:inline-block;margin-top:14px}
#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;display:none}
#tin{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0}
#hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:12px;color:var(--mut);pointer-events:none}
#dock{background:var(--pan);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
#tabs{display:flex;overflow-x:auto;gap:2px;padding:6px 8px;scrollbar-width:none}
#tabs button{flex:none;border:0;background:none;color:var(--mut);padding:8px 12px;border-radius:8px}
#tabs button.on{color:var(--acx);background:var(--ac);font-weight:700}
#panel{height:232px;overflow-y:auto;padding:4px 14px 12px}
.row{display:grid;grid-template-columns:104px 1fr 40px;align-items:center;gap:8px;padding:5px 0}
.row label{color:var(--mut);font-size:13px}
.row output{font-size:12px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.sl{position:relative;height:36px;touch-action:pan-y;cursor:ew-resize}
.sl i,.sl b{position:absolute;top:17px;height:3px;border-radius:2px}
.sl i{left:0;right:0;background:var(--line)}.sl b{background:var(--ac)}
.sl u{position:absolute;top:9px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--ac)}
header button,header .btn{padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.chips button.on{border-color:var(--ac);color:var(--ac)}
.sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw.on{border-color:var(--tx)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:5}
#modal img{max-width:100%;max-height:70%;border-radius:8px}
#modal p{margin:0;text-align:center;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Lumina</h1>
    <button id="undo" aria-label="Undo">&#8630;</button><button id="redo" aria-label="Redo">&#8631;</button><button id="reset">Reset</button>
    <label class="btn" for="file">Open</label>
    <input id="file" type="file" accept="image/*" hidden>
    <button class="pri" id="save">Save</button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas><canvas id="ov"></canvas>
    <div id="empty"><b>Photo kholo</b>Open dabao aur gallery se photo chuno.<br><label class="btn pri" for="file">Open photo</label></div>
    <div id="hint"></div>
  </div>
  <div id="dock">
    <div id="tabs"></div>
    <div id="panel"></div>
  </div>
</div>
<div id="modal"><img id="out" alt="Edited photo"><p>Photo ko lamba dabake rakho aur "Save image / Download image" chuno.</p><button id="close">Close</button></div>

<script>
"use strict";
const $ = s => document.querySelector(s);

/* ---------- slider definitions: key -> [label, min, max] ---------- */
const SL = {
  exposure:["Exposure",-2,2], brightness:["Brightness",-1,1], contrast:["Contrast",-1,1],
  highlights:["Highlights",-1,1], shadows:["Shadows",-1,1], fade:["Fade",0,1],
  temp:["Temp",-1,1], tint:["Tint",-1,1], saturation:["Saturation",-1,1], vibrance:["Vibrance",-1,1], hue:["Hue",-180,180],
  sHue:["Shadow color",0,1], sAmt:["Shadow tone",0,1], hHue:["Highlight color",0,1], hAmt:["Highlight tone",0,1],
  sharp:["Sharpness",0,1], grain:["Grain",0,1], vig:["Vignette",-1,1],
  bril:["Brilliance",-1,1], texr:["Texture",-1,1], struc:["Structure",-1,1], blur:["Blur",0,1],
  fresh:["Freshness",0,1], film:["Faded film",0,1], amb:["Ambient light",0,1], flash:["Flash",0,1], tyn:["Tyndall",0,1], canv:["Canvas texture",0,1],
  glow:["Glow",0,1], bloom:["Highlight glow",0,1], dehaze:["Dehaze",-1,1], ca:["Color split",0,1], leak:["Light leak",0,1],
  lexp:["Exposure",-2,2], lcon:["Contrast",-1,1], lsat:["Saturation",-1,1], ltemp:["Temp",-1,1],
  skin:["Skin smooth",0,1], wrk:["Wrinkles",0,1], skb:["Skin bright",0,1], skt:["Skin tone",-1,1], skg:["Skin shine",0,1],
  tilt:["Tilt blur",0,1], border:["Border",0,1], lsoft:["Soften",0,1], lshp:["Sharpen",0,1],
  mono:["Black & white",0,1], sepia:["Sepia",0,1], poster:["Posterize",0,1]
};
const TABS = {
  filters:{name:"Filters"},
  auto:{name:"Auto"},
  light:{name:"Light", keys:["exposure","brightness","bril","contrast","highlights","shadows","fade"]},
  color:{name:"Color", keys:["temp","tint","saturation","vibrance","hue","fresh","sHue","sAmt","hHue","hAmt"]},
  hsl:{name:"HSL"},
  detail:{name:"Detail", keys:["sharp","texr","struc","blur"]},
  fx:{name:"Effects", keys:["glow","bloom","dehaze","grain","vig","film","amb","flash","tyn","canv","ca","leak","tilt","border","mono","sepia","poster"]},
  curve:{name:"Curve"},
  sel:{name:"Selective", keys:["lexp","lcon","lsat","ltemp","lsoft","lshp"]},
  retouch:{name:"Retouch", keys:["skin","wrk","skb","skt","skg"]},
  text:{name:"Text"},
  crop:{name:"Crop"}
};
const DEF = () => { const o = {}; for (const k in SL) o[k] = 0; o.sHue = .55; o.hHue = .08; return o; };

/* ---------- own presets (khud ke banaye) ---------- */
const PRESETS = {
  "Warm Golden":{temp:.35,tint:.05,contrast:.1,saturation:.1,highlights:-.15,fade:.1,vig:-.2,hAmt:.4,hHue:.09},
  "Moody Teal":{contrast:.2,saturation:-.1,shadows:-.1,temp:-.1,sAmt:.6,sHue:.5,hAmt:.4,hHue:.08,vig:-.4,fade:.15},
  "Vintage Film":{fade:.35,temp:.2,saturation:-.2,contrast:-.05,grain:.35,vig:-.3},
  "Clean Bright":{exposure:.25,contrast:.1,vibrance:.3,shadows:.3,highlights:-.2,sharp:.3},
  "B&W Drama":{saturation:-1,contrast:.35,shadows:-.2,vig:-.4,grain:.2,fade:.05},
  "Soft Pastel":{exposure:.2,contrast:-.2,saturation:-.15,fade:.3,temp:.1,vibrance:.2},
  "Cinematic":{contrast:.25,saturation:-.05,sAmt:.5,sHue:.52,hAmt:.5,hHue:.1,vig:-.35},
  "Dreamy Glow":{glow:.6,bloom:.3,exposure:.15,contrast:-.1,saturation:.1,fade:.1,temp:.1},
  "Golden Hour":{temp:.5,exposure:.1,highlights:-.2,shadows:.2,saturation:.15,leak:.35,hAmt:.4,hHue:.1,vig:-.25,bloom:.2},
  "Neon Night":{contrast:.3,saturation:.3,sAmt:.7,sHue:.75,hAmt:.6,hHue:.9,exposure:-.1,glow:.35,ca:.3,vig:-.4},
  "Matte Black":{contrast:.15,fade:.4,saturation:-.3,shadows:.1,film:.4,vig:-.2},
  "Pastel Pink":{exposure:.2,temp:.15,tint:.2,saturation:-.1,fade:.2,contrast:-.15,glow:.25,hAmt:.3,hHue:.95},
  "Fresh Green":{fresh:.8,vibrance:.3,contrast:.1,exposure:.1,temp:-.1,sharp:.2},
  "Vivid Pop":{saturation:.35,vibrance:.3,contrast:.2,struc:.3,sharp:.3},
  "Noir":{saturation:-1,contrast:.5,exposure:-.1,vig:-.5,grain:.3,struc:.3},
  "Retro 90s":{fade:.25,temp:.25,saturation:.1,grain:.4,leak:.5,ca:.15,vig:-.3,canv:.15},
  "Cool Morning":{temp:-.3,exposure:.15,bril:.3,tyn:.3,fresh:.3,contrast:-.05},
  "Soft Skin":{bril:.25,glow:.3,texr:-.3,exposure:.1,temp:.1,saturation:-.05},
  "Sunset Leak":{temp:.4,tint:.1,saturation:.2,leak:.7,glow:.2,fade:.1,vig:-.3},
  "Portrait Soft":{skin:.5,skb:.2,skg:.2,glow:.2,bril:.2,exposure:.1},
  "Glam Skin":{skin:.7,wrk:.4,skb:.3,skg:.4,skt:.2,vibrance:.15,glow:.15},
  "Miniature":{tilt:.8,saturation:.3,contrast:.15,sharp:.2},
  "Polaroid":{border:.7,fade:.25,temp:.2,grain:.25,vig:-.2}
};
const BANDS = [["Red",0],["Orange",30],["Yellow",60],["Green",120],["Aqua",180],["Blue",240],["Purple",270],["Magenta",300]];
const ASPECTS = [["Original",0],["1:1",1],["4:5",.8],["3:4",.75],["9:16",.5625],["16:9",16/9]];

/* ---------- state ---------- */
let gl, prog, tex, U = {}, orig = null, raf = 0, cmp = false, srcCv = null, H = [], hi = -1;
let P = DEF(), HSL = BANDS.map(() => [0,0,0]), band = 0, tab = "filters", preset = "";
let tf = {rot:0, fx:1, fy:1, ar:0}, cw = 1, ch = 1;
const NC = () => ({m:[[0,0],[1,1]], r:[[0,0],[1,1]], g:[[0,0],[1,1]], b:[[0,0],[1,1]]});
/* ---- text overlay ---- */
let TX = {t:"", size:.08, color:"#ffffff", font:"sans-serif", x:.5, y:.5, bold:true, shadow:true};
function paintTxt(x){ if(!TX.t) return; const px = Math.round(TX.size*cw);
  x.font = `${TX.bold ? "bold " : ""}${px}px ${TX.font}`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillStyle = TX.color;
  if(TX.shadow){ x.shadowColor = "rgba(0,0,0,.6)"; x.shadowBlur = px*.15; } x.fillText(TX.t, TX.x*cw, TX.y*ch); }
function drawTxt(){ const o = $("#ov"); o.width = cw; o.height = ch; o.style.display = TX.t ? "block" : "none"; paintTxt(o.getContext("2d")); }
$("#panel").addEventListener("input", e => { if(e.target.id === "tin"){ TX.t = e.target.value; drawTxt(); } });
let curves = NC(), cc = "m", ctex, mtex, mcv, mctx, selTool = "brush", brSz = .09, selShow = true, paint = null, curOn = false;
/* ---- curve ---- */
function spline(pts){ const n = pts.length, X = pts.map(p => p[0]), Y = pts.map(p => p[1]), d = [], m = [];
  for(let i = 0; i < n-1; i++) d[i] = (Y[i+1]-Y[i]) / (X[i+1]-X[i]);
  m[0] = d[0]; m[n-1] = d[n-2]; for(let i = 1; i < n-1; i++) m[i] = d[i-1]*d[i] <= 0 ? 0 : (d[i-1]+d[i]) / 2;
  return t => { if(t <= X[0]) return Y[0]; if(t >= X[n-1]) return Y[n-1]; let i = 0; while(t > X[i+1]) i++;
    const h = X[i+1]-X[i], u = (t-X[i]) / h, u2 = u*u, u3 = u2*u;
    return (2*u3-3*u2+1)*Y[i] + (u3-2*u2+u)*h*m[i] + (-2*u3+3*u2)*Y[i+1] + (u3-u2)*h*m[i+1]; }; }
function lut(){
  const f = ["m","r","g","b"].map(k => spline(curves[k])), a = new Uint8Array(1024), cl = v => Math.max(0, Math.min(1, v));
  for(let i = 0; i < 256; i++){ const v = cl(f[0](i/255)); for(let j = 0; j < 3; j++) a[i*4+j] = Math.round(cl(f[j+1](v)) * 255); a[i*4+3] = 255; }
  curOn = JSON.stringify(curves) !== JSON.stringify(NC());
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, ctex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, a); gl.activeTexture(gl.TEXTURE0);
}
function drawCur(){
  const c = $("#cvc"); if(!c) return; const x = c.getContext("2d"), W = c.width, Hh = c.height;
  x.clearRect(0, 0, W, Hh); x.strokeStyle = "#2b303a"; x.lineWidth = 1;
  for(let i = 1; i < 4; i++){ x.beginPath(); x.moveTo(i*W/4, 0); x.lineTo(i*W/4, Hh); x.moveTo(0, i*Hh/4); x.lineTo(W, i*Hh/4); x.stroke(); }
  const col = {m:"#eef0f4", r:"#ff5a5a", g:"#5adf7a", b:"#5a9aff"}[cc], pts = curves[cc], f = spline(pts);
  x.strokeStyle = col; x.lineWidth = 3; x.beginPath();
  for(let i = 0; i <= 100; i++){ const t = i/100, y = Math.max(0, Math.min(1, f(t))); i ? x.lineTo(t*W, (1-y)*Hh) : x.moveTo(t*W, (1-y)*Hh); } x.stroke();
  x.fillStyle = col; pts.forEach(p => { x.beginPath(); x.arc(p[0]*W, (1-p[1])*Hh, 9, 0, 7); x.fill(); });
}
/* ---- selective mask ---- */
function mkMask(){ mcv = document.createElement("canvas"); mcv.width = 512; mcv.height = Math.max(1, Math.round(512*ch/cw));
  mctx = mcv.getContext("2d"); mctx.fillStyle = "#000"; mctx.fillRect(0, 0, mcv.width, mcv.height); upMask(); }
function upMask(){ gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, mtex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, mcv); gl.activeTexture(gl.TEXTURE0); schedule(); }
function mpos(e){ const r = $("#cv").getBoundingClientRect(), sc = Math.min(r.width/cw, r.height/ch), dw = cw*sc, dh = ch*sc;
  return [(e.clientX - r.left - (r.width-dw)/2) / dw, (e.clientY - r.top - (r.height-dh)/2) / dh]; }
function selDown(e){ const [x, y] = mpos(e); paint = {x, y}; $("#stage").setPointerCapture(e.pointerId); selMove(e); }
function selMove(e){
  if(!paint) return; if(tab === "text"){ const [tx, ty] = mpos(e); TX.x = tx; TX.y = ty; drawTxt(); return; }
  const [x, y] = mpos(e), W = mcv.width, Hh = mcv.height;
  if(selTool === "brush" || selTool === "erase"){
    const r = brSz*W, X = x*W, Y = y*Hh, c = selTool === "brush" ? "255,255,255" : "0,0,0", g = mctx.createRadialGradient(X, Y, 0, X, Y, r);
    g.addColorStop(0, `rgba(${c},.5)`); g.addColorStop(1, `rgba(${c},0)`); mctx.fillStyle = g; mctx.fillRect(X-r, Y-r, 2*r, 2*r);
  } else {
    mctx.fillStyle = "#000"; mctx.fillRect(0, 0, W, Hh);
    const ax = paint.x*W, ay = paint.y*Hh, bx = x*W, by = y*Hh;
    const g = selTool === "radial" ? mctx.createRadialGradient(ax, ay, 0, ax, ay, Math.max(4, Math.hypot(bx-ax, by-ay))) : mctx.createLinearGradient(ax, ay, bx, by);
    g.addColorStop(0, "#fff"); g.addColorStop(1, "#000"); mctx.fillStyle = g; mctx.fillRect(0, 0, W, Hh);
  }
  upMask();
}
const snap = () => JSON.stringify({P, HSL, tf, preset, cv:curves});
function pushHist(){ if(!orig) return; const s = snap(); if(H[hi] === s) return; H = H.slice(0, hi+1); H.push(s); hi = H.length-1; if(H.length > 60){ H.shift(); hi--; } }
function goHist(n){ if(!orig || n < 0 || n >= H.length) return; hi = n; const o = JSON.parse(H[n]); const re = JSON.stringify(o.tf) !== JSON.stringify(tf);
  P = o.P; HSL = o.HSL; tf = o.tf; preset = o.preset; curves = o.cv; lut(); if(re) build(); renderPanel(); schedule(); }
function smart(){
  const s = document.createElement("canvas"); s.width = 64; s.height = Math.max(1, Math.round(64*ch/cw));
  const x = s.getContext("2d"); x.drawImage(srcCv, 0, 0, s.width, s.height);
  const d = x.getImageData(0, 0, s.width, s.height).data, a = [];
  for(let i = 0; i < d.length; i += 4) a.push((.2126*d[i] + .7152*d[i+1] + .0722*d[i+2]) / 255);
  a.sort((p, q) => p - q);
  const lo = a[a.length*.02|0], up = a[a.length*.98|0], m = a[a.length>>1];
  P.exposure = Math.max(-1, Math.min(1, Math.log2(.45/Math.max(.05, m)) * .6));
  P.contrast = Math.max(0, Math.min(.4, (.9/Math.max(.2, up-lo) - 1) * .5));
  P.vibrance = .2; P.shadows = m < .35 ? .3 : .1; P.highlights = up > .95 ? -.2 : 0;
}

/* ---------- WebGL ---------- */
const FS = `
precision highp float;
uniform sampler2D t; uniform vec2 px;
uniform float exposure,brightness,contrast,highlights,shadows,fade,temp,tint,saturation,vibrance,hue,sHue,sAmt,hHue,hAmt,sharp,grain,vig,bril,texr,struc,blur,fresh,film,amb,flash,tyn,canv,glow,bloom,dehaze,ca,leak,lexp,lcon,lsat,ltemp,skin,wrk,skb,skt,skg,tilt,border,lsoft,lshp,mono,sepia,poster;
uniform sampler2D cur,msk; uniform float cOn,showM;
uniform vec3 bands[8];
varying vec2 uv;
vec3 rgb2hsv(vec3 c){vec4 K=vec4(0.,-1./3.,2./3.,-1.);vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));float d=q.x-min(q.w,q.y);float e=1e-10;return vec3(abs(q.z+(q.w-q.y)/(6.*d+e)),d/(q.x+e),q.x);}
vec3 hsv2rgb(vec3 c){vec4 K=vec4(1.,2./3.,1./3.,3.);vec3 p=abs(fract(c.xxx+K.xyz)*6.-K.www);return c.z*mix(K.xxx,clamp(p-K.xxx,0.,1.),c.y);}
float luma(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
vec3 bl(float r){vec2 o=px*r;return (texture2D(t,uv+vec2(o.x,0.)).rgb+texture2D(t,uv-vec2(o.x,0.)).rgb+texture2D(t,uv+vec2(0.,o.y)).rgb+texture2D(t,uv-vec2(0.,o.y)).rgb+texture2D(t,uv+o).rgb+texture2D(t,uv-o).rgb+texture2D(t,uv+vec2(o.x,-o.y)).rgb+texture2D(t,uv+vec2(-o.x,o.y)).rgb)*.125;}
void main(){
  vec3 c=texture2D(t,uv).rgb;
  float S=1./(px.x*1000.);
  if(ca>0.){vec2 o=(uv-.5)*ca*.02;c.r=texture2D(t,uv+o).r;c.b=texture2D(t,uv-o).b;}
  if(sharp>0.||texr!=0.){c+=(c-bl(1.5*S))*(sharp*2.5+texr*2.);}
  if(struc!=0.||amb>0.){vec3 b=bl(8.*S);c+=(c-b)*struc*1.5;c+=b*b*amb*.6;}
  if(blur>0.){c=mix(c,(bl(4.*S)+bl(9.*S))*.5,blur);}
  if(tilt>0.){c=mix(c,(bl(5.*S)+bl(11.*S))*.5,tilt*smoothstep(.12,.42,abs(uv.y-.5)));}
  vec3 hs=rgb2hsv(clamp(c,0.,1.));
  float sk=(1.-smoothstep(.08,.14,hs.x))*smoothstep(.1,.2,hs.y)*(1.-smoothstep(.65,.8,hs.y))*smoothstep(.2,.35,hs.z);
  if(sk>0.){
    if(skin>0.||wrk>0.){vec3 sb=(bl(2.5*S)+bl(5.*S))*.5;float e=1.-smoothstep(.02,.12,abs(luma(c)-luma(sb)));c=mix(c,sb,skin*sk*e*.9);c=mix(c,bl(1.5*S),wrk*sk*e*.8);}
    c*=1.+skb*sk*.25; c.r*=1.+skt*sk*.15; c.b*=1.-skt*sk*.15; c+=skg*sk*smoothstep(.5,1.,luma(c))*.3;
  }
  c*=pow(2.,exposure);
  c+=brightness*.3;
  c=pow(max(c,0.),vec3(1.-bril*.5));
  c.r*=1.+temp*.3; c.b*=1.-temp*.3; c.g*=1.-tint*.25;
  float l=luma(c);
  float sh=1.-smoothstep(0.,.55,l), hi=smoothstep(.45,1.,l);
  c*=1.+shadows*.7*sh;
  c*=1.+highlights*.4*hi;
  c=(c-.5)*(1.+contrast)+.5;
  c=c*(1.-fade*.25)+fade*.12;
  l=luma(c);
  float s=max(c.r,max(c.g,c.b))-min(c.r,min(c.g,c.b));
  c=mix(vec3(l),c,1.+saturation);
  c=mix(vec3(l),c,1.+vibrance*(1.-s));
  c=c*(1.+fresh*vec3(-.04,.05,.03))+fresh*.03;

function loadFile(f){

    orig = document.createElement("canvas");

    orig.getContext("2d").drawImage(img, 0, 0, orig.width, orig.height);
    URL.revokeObjectURL(img.src);
    tf = {rot:0, fx:1, fy:1, ar:0}; P = DEF(); HSL = BANDS.map(() => [0,0,0]); preset = ""; curves = NC(); lut();
    $("#empty").style.display = "none"; $("#cv").style.display = "block";

    zReset(); build(); H = []; hi = -1; pushHist(); renderPanel();

}

  if(!orig) return;

  const x = c.getContext("2d");
  x.translate(w/2, h/2); x.rotate(tf.rot * Math.PI/2); x.scale(tf.fx, tf.fy); x.drawImage(orig, -sw/2, -sh/2);

  const o = document.createElement("canvas"); o.width = w2; o.height = h2;

    const [a, b] = [...ptrs.values()], r = st.getBoundingClientRect(), d = Math.hypot(a[0]-b[0], a[1]-b[1]);
    Z = Math.max(1, Math.min(8, pg.z * d / pg.d));
    PX = (a[0]+b[0])/2 - r.left - r.width/2 - pg.vx * Z / pg.z; PY = (a[1]+b[1])/2 - r.top - r.height/2 - pg.vy * Z / pg.z; zApply();
  } else if(pg && pg.one){ PX = pg.ox + e.clientX - pg.px; PY = pg.oy + e.clientY - pg.py; zApply(); }
});
["pointerup","pointercancel"].forEach(ev => st.addEventListener(ev, e => {
  ptrs.delete(e.pointerId); pg = null;
  if(ev === "pointerup" && orig && ptrs.size === 0 && tapPos && tab !== "sel" && tab !== "text" && Date.now() - tapT < 250 && Math.hypot(e.clientX-tapPos[0], e.clientY-tapPos[1]) < 10){
    const n = Date.now();
    if(n - lastTap < 350){ if(Z > 1) zReset(); else { Z = 2.5; zApply(); } lastTap = 0; } else lastTap = n;
  }
}));

if(initGL()) renderPanel();
</script>
